<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EZE Viabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>
/* Layout: prancha técnica — carimbo no topo, barra de resultado fixa, seções numeradas na ordem do cálculo */
:root{
  --bg:#EEF2F1; --paper:#FFFFFF; --ink:#14262B; --muted:#5A6B6F; --line:#D3DBDA; --line2:#E6ECEB;
  --accent:#1E5E68; --accent-ink:#FFFFFF; --accent-soft:#E0ECEC; --sand:#A9783A; --sand-soft:#F4EBDD;
  --good:#2C7A4B; --good-soft:#E2F1E7; --warn:#A86B10; --warn-soft:#FBEFD9; --bad:#B23F2C; --bad-soft:#F8E3DE;
  --field:#F7FAF9; --shadow:0 1px 2px rgba(20,38,43,.06),0 4px 16px rgba(20,38,43,.05);
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --paper:#152023; --ink:#E3EBEA; --muted:#93A4A7; --line:#2A3B3E; --line2:#1F2D30;
  --accent:#72B6BF; --accent-ink:#0E1618; --accent-soft:#1C3236; --sand:#D6AA6C; --sand-soft:#2E261B;
  --good:#6DC28E; --good-soft:#18301F; --warn:#E2A955; --warn-soft:#33281A; --bad:#EC8571; --bad-soft:#3A1F1A;
  --field:#1A272A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1618; --paper:#152023; --ink:#E3EBEA; --muted:#93A4A7; --line:#2A3B3E; --line2:#1F2D30;
  --accent:#72B6BF; --accent-ink:#0E1618; --accent-soft:#1C3236; --sand:#D6AA6C; --sand-soft:#2E261B;
  --good:#6DC28E; --good-soft:#18301F; --warn:#E2A955; --warn-soft:#33281A; --bad:#EC8571; --bad-soft:#3A1F1A;
  --field:#1A272A; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark{width:30px;height:30px;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:13px}
.brand b{font-family:var(--f-display);font-size:16px;font-weight:700}
.brand span{color:var(--muted);font-size:12px;display:block;line-height:1.1}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.busy{background:var(--warn)} .dot.err{background:var(--bad)} .dot.off{background:var(--muted)}

.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:6px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.confirm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.ico{width:16px;height:16px;flex:none}

.banner{margin-top:14px;padding:10px 14px;border-radius:6px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:13px}

/* list */
.listhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:28px 18px}
.listhead h1{font-size:28px}
.listhead p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.card:hover{border-color:var(--accent)}
.card .rev{font-family:var(--f-num);font-size:11px;color:var(--muted);letter-spacing:.06em}
.card h3{font-size:16px;line-height:1.25}
.card .sub{color:var(--muted);font-size:13px}
.card .figs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid var(--line2);padding-top:10px}
.fig small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fig b{font-family:var(--f-num);font-weight:500;font-size:13px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* study */
.sumbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.sumbar .wrap{display:flex;align-items:center;gap:10px 22px;padding-block:10px;flex-wrap:wrap}
.sumk{display:flex;flex-direction:column;min-width:0}
.sumk small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sumk b{font-family:var(--f-num);font-weight:500;font-size:15px}
.sumk.big b{font-size:17px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--f-body)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-block:22px 60px}
.toc{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:5px;font-size:13px;display:flex;gap:8px}
.toc a span{font-family:var(--f-num);color:var(--accent);font-size:12px}
.toc a.on{background:var(--paper);color:var(--ink)}
.toc a:hover{background:var(--paper);color:var(--ink)}
.toc .back{margin-bottom:10px;color:var(--accent);font-weight:500}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}.actions{margin-left:0}}

.sec{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:18px;box-shadow:var(--shadow);min-width:0;scroll-margin-top:90px}
.sec>header{display:flex;align-items:baseline;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.sec>header .n{font-family:var(--f-num);color:var(--accent);font-size:13px}
.sec>header h2{font-size:18px}
.sec>header p{flex-basis:100%;margin:2px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.sec .body{padding:16px 18px 18px}

/* carimbo */
.carimbo{display:grid;grid-template-columns:2fr 1fr 1fr;border:1.5px solid var(--ink);border-radius:2px}
.carimbo .c{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px 8px;min-width:0}
.carimbo .c label{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.carimbo .c input{border:0;background:transparent;padding:2px 0;width:100%;font:inherit;color:var(--ink);font-weight:500}
.carimbo .c input:focus{outline:none;background:var(--field)}
.carimbo .c.wide{grid-column:span 3}
.carimbo .c.title input{font-family:var(--f-display);font-size:19px;font-weight:700}
@media (max-width:640px){.carimbo{grid-template-columns:1fr 1fr}.carimbo .c.wide{grid-column:span 2}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 16px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.inp{display:flex;align-items:center;border:1px solid var(--line);background:var(--field);border-radius:5px;overflow:hidden}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp input,.inp select{border:0;background:transparent;color:var(--ink);font:inherit;padding:7px 9px;width:100%;min-width:0}
.inp input.n{font-family:var(--f-num);text-align:right}
.inp input:focus,.inp select:focus{outline:none}
.inp .u{padding:0 9px 0 0;color:var(--muted);font-size:12px;white-space:nowrap}
.inp .pre{padding:0 0 0 9px;color:var(--muted);font-size:12px}
.calc{border:1px dashed var(--line);border-radius:5px;padding:7px 9px;font-family:var(--f-num);text-align:right;background:transparent;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.formula{margin-top:14px;padding:10px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.formula b{font-family:var(--f-num);font-weight:500}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:8px 8px;background:var(--line2);white-space:nowrap}
td{padding:3px 6px;border-top:1px solid var(--line2);vertical-align:middle}
th.r,td.r{text-align:right}
td .cell{border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;padding:5px 6px;border-radius:4px;width:100%;min-width:0}
td .cell:hover{border-color:var(--line)}
td .cell:focus{outline:none;border-color:var(--accent);background:var(--field)}
td .cell.n{font-family:var(--f-num);text-align:right}
td select.cell{cursor:pointer}
td.out{font-family:var(--f-num);text-align:right;white-space:nowrap;padding-right:10px}
tr.grp td{background:var(--accent-soft);font-weight:600;padding:6px 8px}
tr.grp .gmeta{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
tr.perm td:first-child{box-shadow:inset 3px 0 0 var(--sand)}
tr.perm{background:var(--sand-soft)}
tfoot td{font-weight:600;background:var(--line2);padding:8px}
.del{border:0;background:transparent;color:var(--muted);padding:4px 6px;border-radius:4px}
.adot{color:var(--accent);font-weight:500}
.del:hover{color:var(--bad);background:var(--bad-soft)}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;font-weight:600}
.tag.perm{background:var(--sand-soft);color:var(--sand);border:1px solid var(--sand)}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tool{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--field);display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.tool .f{min-width:130px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* results */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--f-num);font-weight:500;font-size:19px;margin-top:4px;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero small,.kpi.hero span{color:var(--accent-ink);opacity:.8}
.cols2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;margin-top:22px}
@media (max-width:900px){.cols2{grid-template-columns:minmax(0,1fr)}}
h3.mini{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--f-body);font-weight:600;margin-bottom:10px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .lbl{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar .lbl .num{color:var(--muted);font-size:12px}
.bar .track{height:8px;background:var(--line2);border-radius:4px;margin-top:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar.perm .fill{background:var(--sand)}
.bar.profit .fill{background:var(--good)}
.bar.loss .fill{background:var(--bad)}
.ind td{padding:7px 8px}
.ind td:last-child{text-align:right;font-family:var(--f-num)}
.sens th,.sens td{text-align:center;padding:7px 6px}
.sens td{font-family:var(--f-num);font-size:12.5px}
.sens td.h{font-family:var(--f-body);font-weight:600;color:var(--muted);background:var(--line2);font-size:12px}
.sens td.g{background:var(--good-soft);color:var(--good)} .sens td.w{background:var(--warn-soft);color:var(--warn)} .sens td.b{background:var(--bad-soft);color:var(--bad)}
.sens td.base{outline:2px solid var(--ink);outline-offset:-2px;font-weight:600}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.alert{font-size:13px;padding:8px 12px;border-radius:5px;background:var(--warn-soft);border-left:3px solid var(--warn)}
.alert.ok{background:var(--good-soft);border-left-color:var(--good)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;padding:10px;font:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.ro input,.ro select,.ro textarea{pointer-events:none}
.topuser{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topuser .who{font-size:12px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{max-width:420px;margin:48px auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.lhead{display:flex;gap:14px;align-items:center}
.lhead h1{font-size:22px}
.lhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.mark.big{width:44px;height:44px;font-size:15px}
.lform{display:flex;flex-direction:column;gap:14px}
.lform .btn.pri{justify-content:center;padding:10px 14px}
.lmail{font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--field);border:1px solid var(--line);border-radius:6px;overflow-wrap:anywhere}
.llinks{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.llinks .btn{color:var(--accent);padding-left:0}
.lfoot{margin:0;font-size:12px;color:var(--muted)}
.accform{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ur{display:inline-flex;gap:4px}
.ur .btn{padding:5px 8px}
.pubbox{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pubbox>div{flex:1;min-width:240px}
.pubbox p{margin:4px 0 0;font-size:13px;color:var(--muted);max-width:75ch}
.tag.pub{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--paper);border-left:1px solid var(--line);z-index:15;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
[hidden]{display:none!important}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dhead h2{font-size:18px}
.dnote{margin:0;font-size:13px;color:var(--muted)}
.ver{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.vt{display:flex;flex-direction:column;gap:2px}
.vt span{font-size:12px;color:var(--muted)}
.vsum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.vsum b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.vsum b.pill{font-family:var(--f-body)}
.vact{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.bar .fill{transition:width .3s}}
</style>

</head>
<body>
<div class="top"><div class="wrap">
  <a class="brand" href="#inicio"><div class="mark">EVF</div><div><b>EZE Viabilidade</b><span>Estudos de viabilidade financeira</span></div></a>
  <div class="spacer"></div>
  <div class="status" id="status"><i class="dot off"></i><span>Conectando…</span></div><div class="topuser" id="topUser"></div>
</div></div>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>


<script>
/* ============ utilidades ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = +v; return Number.isFinite(n) ? n : 0; };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const nf = (d) => new Intl.NumberFormat('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const fN = (v, d=2) => nf(d).format(num(v));
const fR = (v, d=0) => 'R$ ' + nf(d).format(num(v));
const fP = (v, d=1) => nf(d).format(num(v) * 100) + '%';
const fM = (v) => { const a = Math.abs(num(v)); return a >= 1e6 ? 'R$ ' + nf(2).format(v/1e6) + ' mi' : fR(v); };
const fDate = s => { if (!s) return '—'; const [y,m,d] = String(s).split('-'); return d ? `${d}/${m}/${y}` : s; };
function parseBR(str) {
  let s = String(str).trim().replace(/[R$%\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return Number.isFinite(n) ? n : 0;
}

function defaultQuadro() { return ['Térreo', 'Tipo', 'Cobertura', 'Barrilete', 'Reservatório'].map(d => ({id:rid(), desc:d, obs:'', qtd:1, area:0})); }
function defaultUrb() { return ['Número de unidades', 'Número de unidades residenciais', 'Número de unidades comerciais', 'Área comum', 'Área comercial', 'Área residencial'].map(d => ({id:rid(), desc:d, pct:null, valor:''})); }
const quadroTotal = s => (s.quadroAreas || []).reduce((a, q) => a + num(q.qtd) * num(q.area), 0);
const MODOS = {fixo:'Valor fixo (R$)', vgv:'% do VGV', obra:'% do custo de obra'};

function unitPrice(s, u) { return num(u.pm) > 0 ? num(u.pm) : num(s.precoBase); }
function precoAdotado(s, u) { return unitPrice(s, u) * num(u.fpos || 1) * num(u.fpav || 1); }
function calc(s, opt={}) {
  const pk = 1 + (opt.dPreco || 0), ok = 1 + (opt.dObra || 0);
  const U = s.unidades || [];
  const uv = U.map(u => num(u.area) * unitPrice(s, u) * pk * num(u.fpos || 1) * num(u.fpav || 1));
  const areaPriv = U.reduce((a, u) => a + num(u.area), 0);
  const vgv = uv.reduce((a, b) => a + b, 0);
  const permuta = U.reduce((a, u, i) => a + (u.tipo === 'permuta' ? uv[i] : 0), 0);
  const venda = vgv - permuta;
  const nPerm = U.filter(u => u.tipo === 'permuta').length;
  const custoM2Obra = num(s.cub) * num(s.fatorCub) * ok;
  const obra = num(s.areaConstruida) * custoM2Obra;
  const ov = (s.outorgas || []).map(o => num(o.area) * num(s.cub) * num(o.pct) / 100);
  const outorga = ov.reduce((a, b) => a + b, 0);
  const comissao = venda * num(s.comissao) / 100;
  const imposto = venda * num(s.imposto) / 100;
  const cv = (s.custos || []).map(c => c.modo === 'vgv' ? vgv * num(c.valor) / 100 : c.modo === 'obra' ? obra * num(c.valor) / 100 : num(c.valor));
  const items = [
    {k:'permuta', label:'Permuta (unidades dadas pelo terreno)', base:`${nPerm} unidade${nPerm===1?'':'s'}`, v:permuta},
    {k:'obra', label:'Obra', base:`${fN(s.areaConstruida)} m² × ${fR(custoM2Obra,2)}/m²`, v:obra},
    {k:'outorga', label:'Outorgas', base:`${(s.outorgas||[]).length} item(ns)`, v:outorga},
    {k:'comissao', label:'Corretagem', base:`${fN(s.comissao,1)}% das vendas`, v:comissao},
    {k:'imposto', label:'Impostos', base:`${fN(s.imposto,1)}% das vendas`, v:imposto},
    ...(s.custos || []).map((c, i) => ({k:'c'+i, label:c.desc || 'Outro custo', base: c.modo==='fixo' ? 'valor fixo' : `${fN(c.valor,1)}% ${c.modo==='vgv'?'do VGV':'da obra'}`, v:cv[i]})),
  ];
  const total = items.reduce((a, b) => a + b.v, 0);
  const lucro = vgv - total;
  return { uv, ov, cv, items, areaPriv, vgv, permuta, venda, nPerm, nUn:U.length, custoM2Obra, obra, outorga, comissao, imposto, total, lucro,
    margem: vgv ? lucro / vgv : 0, sobreObra: obra ? lucro / obra : 0, sobreCusto: total ? lucro / total : 0,
    custoM2: num(s.areaConstruida) ? total / num(s.areaConstruida) : 0, vgvM2: areaPriv ? vgv / areaPriv : 0,
    eficiencia: num(s.areaConstruida) ? areaPriv / num(s.areaConstruida) : 0, ticket: U.length ? vgv / U.length : 0 };
}
const margemCls = m => m >= 0.2 ? 'good' : m >= 0.1 ? 'warn' : 'bad';
const D_PRECO = [-0.15, -0.10, -0.05, 0, 0.05, 0.10], D_OBRA = [-0.10, 0, 0.10, 0.20];
function groupsOf(s) {
  const map = new Map();
  (s.unidades || []).forEach((u, i) => { const k = (u.pav || '').trim() || 'Sem pavimento'; if (!map.has(k)) map.set(k, []); map.get(k).push(i); });
  const out = new Map();
  [...map.keys()].sort(COLL.compare).forEach(k => out.set(k, map.get(k).sort((a, b) => COLL.compare(s.unidades[a].nome || '', s.unidades[b].nome || ''))));
  return out;
}
const ARR = {u:'unidades', o:'outorgas', c:'custos', q:'quadroAreas', d:'dadosUrb'};
const pavKey = u => (u.pav || '').trim() || 'Sem pavimento';
const COLL = new Intl.Collator('pt-BR', {numeric:true, sensitivity:'base'});
function nextUnitName(s, idx) {
  let best = null;
  idx.forEach(i => { const m = String(s.unidades[i].nome || '').match(/^(.*?)(\d+)(\D*)$/); if (m && (!best || +m[2] > +best[2])) best = m; });
  return best ? best[1] + String(+best[2] + 1).padStart(best[2].length, '0') + best[3] : 'Nova unidade';
}

  return a;
}

const H = { past:[], future:[], key:null, t:0 };
function resetHist() { H.past = []; H.future = []; H.key = null; }
function snap(key) {
  if (!S.cur) return;
  const now = Date.now();
  if (key && key === H.key && now - H.t < 800) { H.t = now; return; }
  H.past.push(JSON.stringify(S.cur)); if (H.past.length > 100) H.past.shift();
  H.future = []; H.key = key || null; H.t = now;
}
function undo() {
  if (!S.cur || !S.canWrite) return;
  if (!H.past.length) { toast('Nada para desfazer.'); return; }
  H.future.push(JSON.stringify(S.cur)); S.cur = JSON.parse(H.past.pop()); H.key = null;
  renderStudy(true); scheduleSave();
}
function redo() {
  if (!S.cur || !S.canWrite) return;
  if (!H.future.length) { toast('Nada para refazer.'); return; }
  H.past.push(JSON.stringify(S.cur)); S.cur = JSON.parse(H.future.pop()); H.key = null;
  renderStudy(true); scheduleSave();
}
document.addEventListener('keydown', e => {

function cleanBody(o) { const d = clone(o); ['_client', '_rev', '_uid', 'id', 'atualizadoPor'].forEach(k => delete d[k]); return d; }
function scheduleSave() {
  if (!S.cur || !S.canWrite || S.mode !== 'db') return;
  S.cur.atualizadoEm = Date.now();
  setStatus('busy', 'Salvando…'); S.dirty = true;
  clearTimeout(S.saveT); S.saveT = setTimeout(doSave, 900);
}
async function doSave() {
  S.saveT = null;
  if (!S.cur || !sb) return;
  if (S.saving) { S.again = true; return; }
  S.saving = true;
  const id = S.curId, body = cleanBody(S.cur), myRev = S.rev;
  try {
    const { data, error } = await sb.from('estudos').update({dados: body, nome: body.nome || '', publico: !!body.publico, rev: myRev + 1, atualizado_em: new Date().toISOString()}).eq('id', id).eq('rev', myRev).select('rev');
    if (error) throw error;
    if (!data || !data.length) { await handleConflict(id, body); }
    else { S.rev = data[0].rev; if (!S.again) S.dirty = false; setStatus('', 'Salvo às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})); }
  } catch (e) {
    setStatus('err', 'Erro ao salvar. Confira a internet.');
    toast('Não foi possível salvar: ' + (e?.message || 'erro desconhecido'));
  }
  S.saving = false;
  if (S.again) { S.again = false; doSave(); }
}
async function handleConflict(id, mine) {
  const { data } = await sb.from('estudos').select('*').eq('id', id).maybeSingle();
  if (!data) { toast('Este estudo foi excluído por outra pessoa.'); location.hash = 'inicio'; return; }
  try { await sb.from('estudo_versoes').insert({estudo_id:id, nome:'Minha edição (conflito) · ' + stamp(), dados:mine}); } catch (e) {}
  S.cur = fromRow(data); S.rev = data.rev; S.dirty = false; resetHist(); renderStudy(true); loadVersions();
  toast(`${data.atualizado_por || 'Outra pessoa'} salvou antes de você. Carreguei a versão dela; a sua ficou guardada em Versões.`);
  setStatus('', 'Atualizado');
}

function fillUrbanos(s) {

    'área comum': {valor: num(s.areaConstruida) ? fN(num(s.areaConstruida) - c.areaPriv) + ' m²' : ''},
    'área residencial': {valor: fN(c.areaPriv) + ' m²', pct: Math.round(c.eficiencia * 10000) / 100},

  s.dadosUrb.forEach(d => { const k = String(d.desc || '').trim().toLowerCase(); if (vals[k]) { Object.assign(d, vals[k]); seen.add(k); } });

}

  }

const fileBase = s => (s.nome || 'estudo').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '_' + (s.revisao || 'R00');
const pdfT = str => String(str).replace(/[  ]/g, ' ').replace(/²/g, '2').replace(/[↓→←]/g, '').replace(/[–—]/g, '-');

function exportPDF(sArg) {
  if (!window.jspdf) { toast('O gerador de PDF não carregou. Recarregue a página.'); return; }
  const s = sArg || S.cur, c = calc(s);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const W = 210, M = 14, CW = W - 2 * M;
  const ACC = [30, 94, 104], INK = [20, 38, 43], MUT = [90, 107, 111], LINE = [211, 219, 218], SOFT = [224, 236, 236], SAND = [169, 120, 58], SANDS = [244, 235, 221];
  const T = pdfT;
  const tbl = (opt) => doc.autoTable(Object.assign({
    theme:'grid', margin:{left:M, right:M, top:22, bottom:18},
    styles:{font:'helvetica', fontSize:8.2, cellPadding:1.8, textColor:INK, lineColor:LINE, lineWidth:0.15},
    headStyles:{fillColor:ACC, textColor:255, fontStyle:'bold', fontSize:7.6},
    footStyles:{fillColor:SOFT, textColor:INK, fontStyle:'bold'},
  }, opt));
  const title = (txt, y) => { doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...ACC); doc.text(T(txt).toUpperCase(), M, y); doc.setDrawColor(...ACC); doc.setLineWidth(0.4); doc.line(M, y + 1.6, M + CW, y + 1.6); return y + 6; };
  const ensure = (y, need) => { if (y + need > 280) { doc.addPage(); return 26; } return y; };

function exportXLSX() {

  const s = S.cur, c = calc(s);
  const wb = XLSX.utils.book_new();
  const resumo = [
    ['ESTUDO DE VIABILIDADE FINANCEIRA'], [],

    ['Data', fDate(s.data)], ['Revisão', s.revisao], ['Responsável', s.responsavel], ['Empresa', s.empresa], [],
    ['Área total construída (m²)', num(s.areaConstruida)], ['Área privativa (m²)', c.areaPriv], ['Área de lazer (m²)', num(s.areaLazer)],
    ['CUB/SC (R$/m²)', num(s.cub)], ['Fator sobre CUB', num(s.fatorCub)], ['Preço base (R$/m²)', num(s.precoBase)],
    ['Corretagem (%)', num(s.comissao)], ['Impostos (%)', num(s.imposto)], [],

    ['Custo total', '', c.total, c.vgv ? c.total / c.vgv : 0], ['VGV', '', c.vgv, 1], ['Lucro estimado', '', c.lucro, c.margem], [],
    ['Lucro ÷ custo de obra', c.sobreObra], ['Lucro ÷ custo total', c.sobreCusto],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(resumo); ws1['!cols'] = [{wch:32}, {wch:34}, {wch:18}, {wch:10}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Resumo');
  const un = [['Unidade', 'Pavimento', 'Área m²', 'Fator posição', 'Fator pav.', 'R$/m² base', 'R$/m² adotado', 'Valor (R$)', 'Tipo'],
    ...[...groupsOf(s).values()].flat().map(i => { const u = s.unidades[i]; return [u.nome, u.pav, num(u.area), num(u.fpos), num(u.fpav), unitPrice(s, u), Math.round(precoAdotado(s, u) * 100) / 100, Math.round(c.uv[i] * 100) / 100, u.tipo === 'permuta' ? 'Permuta' : 'Venda']; })];
  const ws2 = XLSX.utils.aoa_to_sheet(un); ws2['!cols'] = [{wch:14}, {wch:24}, {wch:10}, {wch:12}, {wch:10}, {wch:12}, {wch:14}, {wch:16}, {wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Unidades');
  const qa = [['QUADRO DE ÁREAS'], ['Pavimento', 'Observação', 'Repetições', 'Área (m²)', 'Total (m²)'],
    ...(s.quadroAreas || []).map(q => [q.desc, q.obs, num(q.qtd), num(q.area), num(q.qtd) * num(q.area)]),
    ['TOTAL', '', '', '', quadroTotal(s)], [], ['DADOS URBANÍSTICOS'], ['Item', '%', 'Valor'],
    ...(s.dadosUrb || []).map(d => [d.desc, d.pct === null || d.pct === undefined ? '' : num(d.pct) / 100, d.valor])];
  const ws3 = XLSX.utils.aoa_to_sheet(qa); ws3['!cols'] = [{wch:34}, {wch:24}, {wch:12}, {wch:12}, {wch:14}];
  XLSX.utils.book_append_sheet(wb, ws3, 'Áreas');
  const out = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  offerFile(fileBase(s) + '.xlsx', new Blob([out]));
}

document.addEventListener('submit', async e => {
  const f = e.target; if (!f.classList?.contains('lform')) return;
  e.preventDefault();
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  L.msg = ''; L.err = '';
  try {
    if (f.id === 'fEmail') {
      L.email = $('#lEmail').value.trim().toLowerCase();
      const { data, error } = await sb.rpc('email_liberado', {p_email: L.email});
      if (error) throw error;
      if (!data) L.err = 'Este e-mail não tem acesso. Peça liberação ao administrador.'; else L.step = 'senha';
    } else if (f.id === 'fLogin') {
      const { error } = await sb.auth.signInWithPassword({email: L.email, password: $('#lPass').value});
      if (error) { L.err = /invalid/i.test(error.message) ? 'Senha incorreta. Se for seu primeiro acesso, clique em "Primeiro acesso? Criar minha senha".' : error.message; }
      else { await enterApp(); return; }
    } else if (f.id === 'fSignup') {
      const p1 = $('#lP1').value, p2 = $('#lP2').value;
      if (p1 !== p2) L.err = 'As senhas não são iguais.';
      else {
        const { data, error } = await sb.auth.signUp({email: L.email, password: p1, options:{emailRedirectTo: location.origin}});
        if (error) L.err = /registered|exists/i.test(error.message) ? 'Este e-mail já tem senha. Use "Já tenho senha" ou "Esqueci minha senha".' : /acesso/i.test(error.message) ? 'Este e-mail não tem acesso liberado.' : error.message;
        else if (data.session) { await enterApp(); return; }
        else { L.step = 'senha'; L.msg = 'Senha criada. Enviamos um e-mail de confirmação: clique no link e depois entre com a senha.'; }
      }
    } else if (f.id === 'fNew') {
      const p1 = $('#lN1').value, p2 = $('#lN2').value;
      if (p1 !== p2) L.err = 'As senhas não são iguais.';
      else { const { error } = await sb.auth.updateUser({password: p1}); if (error) L.err = error.message; else { toast('Senha alterada.'); L.step = 'email'; history.replaceState(null, '', location.pathname + '#inicio'); await enterApp(); return; } }
    }
  } catch (err) { L.err = 'Não foi possível continuar: ' + (err?.message || 'erro de conexão'); }
  renderLogin();
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'lBack') { L.step = 'email'; L.err = L.msg = ''; renderLogin(); }
  if (t.id === 'lFirst') { L.step = 'criar'; L.err = L.msg = ''; renderLogin(); }
  if (t.id === 'lHave') { L.step = 'senha'; L.err = L.msg = ''; renderLogin(); }
  if (t.id === 'lForgot') {
    const { error } = await sb.auth.resetPasswordForEmail(L.email, {redirectTo: location.origin + location.pathname});
    L.err = error ? error.message : ''; L.msg = error ? '' : `Enviamos um link para ${L.email}. Abra o e-mail e clique no link para criar uma nova senha.`; renderLogin();
  }
  if (t.id === 'logoutBtn') { await sb.auth.signOut(); S.email = S.role = null; L.step = 'email'; L.msg = L.err = ''; closeStudy(); location.hash = ''; renderLogin(); }
});

/* ============ acessos (admin) ============ */
const A = { rows:[], confirm:null, err:'' };
async function renderAcessos() {
  if (S.role !== 'admin') { location.hash = 'inicio'; return; }
  const { data, error } = await sb.rpc('acessos_status');
  A.rows = data || []; A.err = error ? error.message : '';
  drawAcessos();
}
const PAPEIS = {admin:'Admin (tudo + acessos)', editor:'Editor (cria e edita)', leitor:'Leitor (só vê e exporta)'};
function drawAcessos() {
  const rows = A.rows.map(r => `<tr>
    <td style="width:170px"><input class="cell" data-accnome="${esc(r.email)}" value="${esc(r.nome || '')}" title="Primeiro nome que aparece para os outros"></td>
    <td>${esc(r.email)}${r.email === S.email ? ' <span class="tag pub">você</span>' : ''}</td>
    <td style="width:220px">${r.email === S.email ? esc(PAPEIS[r.papel]) : `<select class="cell" data-papel="${esc(r.email)}">${Object.entries(PAPEIS).map(([k, v]) => `<option value="${k}" ${r.papel === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`}</td>
    <td>${r.tem_conta ? '<span class="pill good">Já criou senha</span>' : '<span class="pill warn">Ainda não acessou</span>'}</td>
    <td style="width:170px;text-align:right">${r.email === S.email ? '' : `<button class="btn sm ghost danger ${A.confirm === r.email ? 'confirm' : ''}" data-rmacc="${esc(r.email)}">${A.confirm === r.email ? 'Confirmar remoção' : 'Remover acesso'}</button>`}</td></tr>`).join('');
  $('#app').innerHTML = `<div class="wrap">
    <div class="listhead"><div><a class="btn sm ghost" href="#inicio">← Estudos</a><h1 style="margin-top:8px">Acessos</h1><p>Só os e-mails desta lista conseguem entrar. Para os outros usuários aparece apenas o primeiro nome de cada pessoa, nunca o e-mail. Depois de liberar, envie o link do sistema para a pessoa: no primeiro acesso ela cria a própria senha.</p></div></div>
    ${A.err ? `<div class="alert">${esc(A.err)}</div>` : ''}
    <section class="sec"><div class="body">
      <form id="fAcc" class="accform">
        <div class="f" style="flex:1;min-width:150px"><label for="aNome">Primeiro nome</label><div class="inp"><input id="aNome" placeholder="Ex.: Gilson"></div></div>
        <div class="f" style="flex:2;min-width:220px"><label for="aEmail">E-mail para liberar</label><div class="inp"><input id="aEmail" type="email" required placeholder="nome@empresa.com.br"></div></div>
        <div class="f" style="flex:1;min-width:200px"><label for="aPapel">Tipo de acesso</label><div class="inp"><select id="aPapel">${Object.entries(PAPEIS).map(([k, v]) => `<option value="${k}" ${k === 'editor' ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
        <button class="btn pri" type="submit">${ICON.plus}Liberar acesso</button>
      </form>
      <div class="tw" style="margin-top:16px"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Acesso</th><th>Situação</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="5" style="padding:14px">Nenhum e-mail liberado.</td></tr>'}</tbody></table></div>
      <div class="pubbox" style="margin-top:16px"><div><b>Link do sistema</b><p>${esc(location.origin + location.pathname)}</p></div><button class="btn sm" data-copy="${esc(location.origin + location.pathname)}">Copiar link</button></div>
    </div></section></div>`;
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fAcc') return;
  e.preventDefault();
  const email = $('#aEmail').value.trim().toLowerCase(), papel = $('#aPapel').value;
  const { error } = await sb.from('acessos').upsert({email, papel, nome: ($('#aNome').value.trim() || null)});
  if (error) toast('Não foi possível liberar: ' + error.message); else toast(`${email} liberado.`);
  renderAcessos();
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.dataset?.accnome === undefined) return;
  const nome = el.value.trim();
  const { error } = await sb.from('acessos').update({nome: nome || null}).eq('email', el.dataset.accnome);
  toast(error ? 'Não foi possível salvar o nome: ' + error.message : 'Nome salvo.');
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.dataset?.papel === undefined) return;
  const { error } = await sb.from('acessos').update({papel: el.value}).eq('email', el.dataset.papel);
  toast(error ? 'Não foi possível alterar: ' + error.message : 'Acesso alterado.'); renderAcessos();
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.rmacc) {
    const em = t.dataset.rmacc;
    if (A.confirm !== em) { A.confirm = em; drawAcessos(); setTimeout(() => { if (A.confirm === em) { A.confirm = null; if (location.hash === '#acessos') drawAcessos(); } }, 5000); return; }
    A.confirm = null;
    const { error } = await sb.from('acessos').delete().eq('email', em);
    toast(error ? 'Não foi possível remover: ' + error.message : `Acesso de ${em} removido.`); renderAcessos();
  }
  if (t.dataset.copy) {
    try { await navigator.clipboard.writeText(t.dataset.copy); toast('Link copiado.'); } catch (err) { toast(t.dataset.copy); }
  }
});

/* ============ início ============ */
async function enterApp() {
  const { data: { session } } = await sb.auth.getSession();
  if (L.step === 'nova' && session) { renderLogin(); return; }
  if (!session) { renderLogin(); return; }
  S.email = (session.user.email || '').toLowerCase(); S.uid = session.user.id;
  const { data: role } = await sb.rpc('meu_papel');
  if (!role) {
    S.mode = 'login'; renderTopUser();
    $('#app').innerHTML = `<div class="wrap"><div class="login"><h1>Sem acesso</h1><p>O e-mail ${esc(S.email)} não está liberado (ou o acesso foi removido). Peça ao administrador.</p><button class="btn" id="logoutBtn">Sair</button></div></div>`;
    return;
  }
  S.role = role; S.canWrite = role === 'admin' || role === 'editor'; S.mode = 'db';
  setStatus('', S.canWrite ? 'Conectado' : 'Somente leitura'); renderTopUser();
  clearInterval(S.listT); S.listT = setInterval(async () => { if (S.mode === 'db' && !S.curId && !document.hidden && (location.hash === '#inicio' || !location.hash)) { if (await loadList()) renderList(); } }, 20000);
  const h = location.hash.slice(1);
  if (!h || h.startsWith('access_token') || h.startsWith('error')) history.replaceState(null, '', location.pathname + '#inicio');
  route();
}
async function boot() {
  if (!sb) { $('#app').innerHTML = `<div class="wrap"><div class="empty" style="margin-top:30px"><h3>Não foi possível carregar</h3><p>Recarregue a página. Se continuar, confira a internet.</p></div></div>`; return; }
  const h = location.hash.slice(1);
  if (h === 'publico' || h.startsWith('publico-')) history.replaceState(null, '', location.pathname);
  S.mode = 'connecting';
  await enterApp();
}
window.addEventListener('hashchange', route);
sb?.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') { L.step = 'nova'; L.err = L.msg = ''; renderLogin(); } });
if (/type=recovery/.test(location.hash)) { L.step = 'nova'; }
boot();

</script>
</body>
</html>
